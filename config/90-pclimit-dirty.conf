# Installed to /etc/sysctl.d/ by scripts/install.ps1 (wsl2-pagecache-limit).
#
# The page cache hard limit applies to clean page cache: direct reclaim cannot
# write dirty pages back, so dirty and writeback pages are excluded from it.
# These two values bound how much dirty data can sit on top of the limit.
# Change them at any time with scripts/set-limits.ps1 (applies immediately and
# rewrites this file).
vm.dirty_bytes = 1073741824
vm.dirty_background_bytes = 268435456
